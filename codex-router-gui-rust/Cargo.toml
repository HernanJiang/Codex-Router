[package]
name = "codex-router"
version = "3.2.9"
edition = "2021"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.19"
anyhow = "1.0"
arboard = "3.6"
chrono = "0.4"
cron = "0.15"
dirs = "5.0"
libc = "0.2"
rfd = "0.15"
regex = "1.11"
url = "2.5"
sha2 = "0.10"
hmac = "0.12"
toml_edit = "0.22"
zeroize = "1.8"
zstd = "0.13"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
axum = { version = "0.8", features = ["ws"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"
flate2 = "1.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "blocking"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "signal", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
uuid = { version = "1", features = ["v7", "serde"] }
aes-gcm = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
windres = "0.2"

[lib]
# The lib must not share a crate name with the `codex-router` bin (whose crate
# name is `codex_router`): the collision makes rustc skip native-library
# propagation from this rlib, silently dropping the Windows icon/manifest/
# version resource from the GUI executable.
name = "codex_router_lib"
path = "src/lib.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "codex-router"
path = "src/main.rs"

[[bin]]
name = "codex-router-host"
path = "src/router_host.rs"
